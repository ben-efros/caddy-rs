name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rust version comes from rust-toolchain.toml, not from the action tag: pinning the
      # tag made Dependabot propose nonexistent toolchains (1.120.0) and broke CI.
      # Version and components come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release

  # The `pm` job that used to live here is deliberately gone (T-PMW-061).
  #
  # It set its cargo commands to run inside pm/, but pm/ is not a workspace root: pm/Cargo.toml
  # is a comment-only virtual manifest by design, and pm's crates are members of the
  # ROOT workspace (see ../Cargo.toml, entries "pm/crates/pm-*"). Since T-REL-020 (4b412047bd97)
  # made that true, every command with cwd=pm fails before compiling anything:
  #
  #   error: failed to parse manifest at `pm/Cargo.toml`
  #   Caused by: manifest is missing either a `[package]` or a `[workspace]`
  #
  # The job was also redundant: the workspace-root `test` job above runs `cargo test --workspace`,
  # and `cargo metadata` from the root resolves all 12 caddy-rs-pm-* crates, so their tests, format
  # and release build already run there. Re-adding a pm-directory job would restore only the
  # failure. If pm ever needs its own job, give it a real [workspace] manifest first.


name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rust version comes from rust-toolchain.toml, not from the action tag: pinning the
      # tag made Dependabot propose nonexistent toolchains (1.120.0) and broke CI.
      # Version and components come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --workspace --release

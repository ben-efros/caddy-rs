name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary keeps the job short; the gate itself is `cargo audit`'s exit status.
      # The version is pinned: the action resolves its own default otherwise, so the gate could
      # start failing (or silently stop failing) on a tool upgrade nobody reviewed. 0.22.2 is the
      # version this policy was verified against; bump it together with `.cargo/audit.toml` when
      # adopting a new cargo-audit.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      # The policy (accepted advisories with reasons) lives in .cargo/audit.toml, so the exit code
      # is the whole decision. `--deny warnings` makes informational advisories (unmaintained,
      # unsound, yanked) gate too, so accepting one is a reviewed policy entry rather than log
      # noise. This replaced rustsec/audit-check, which failed with
      # "Not Found ... checks/runs#update-a-check-run" after a clean audit because it tries to update
      # a check run it did not create in this run.
      #
      # The advisory database is vendored at a pinned commit (.cargo/advisory-db, provenance in
      # .cargo/advisory-db/SNAPSHOT) and `--no-fetch` stops cargo-audit from reaching for the
      # network, so the verdict depends only on the committed lockfile, the committed policy and
      # the committed database. Before T-CI-002 the job cloned RustSec at run time, which meant an
      # upstream advisory added overnight could fail (or clear) this gate with no change here.
      # Refreshing the database is a reviewed commit, not an ambient CI side effect.
      - name: RustSec advisory check (vendored database, no network)
        run: cargo audit --file Cargo.lock --deny warnings --db .cargo/advisory-db --no-fetch
      # A snapshot that silently stopped being loaded would make the gate vacuous, so prove it was
      # read: cargo-audit reports the advisory count from the --db path, and it must be non-zero.
      - name: Vendored advisory database was actually loaded
        run: |
          set -Eeuo pipefail
          out="$(cargo audit --file Cargo.lock --db .cargo/advisory-db --no-fetch 2>&1)"
          echo "$out"
          grep -q 'Loaded [1-9][0-9]* security advisories (from .*\.cargo/advisory-db)' <<<"$out" \
            || { echo "::error::the vendored advisory database was not loaded"; exit 1; }

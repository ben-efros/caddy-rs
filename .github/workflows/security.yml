name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A prebuilt binary keeps the job short; the gate itself is `cargo audit`'s exit status.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # The policy (accepted advisories with reasons) lives in .cargo/audit.toml, so the exit code
      # is the whole decision. This replaced rustsec/audit-check, which failed with
      # "Not Found ... checks/runs#update-a-check-run" after a clean audit because it tries to update
      # a check run it did not create in this run.
      - name: RustSec advisory check
        run: cargo audit --file Cargo.lock

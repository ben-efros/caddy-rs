name: clippy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny correctness, warn on the rest)
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness

name: clippy

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Rust version comes from rust-toolchain.toml, not from the action tag: pinning the
      # tag made Dependabot propose nonexistent toolchains (1.120.0) and broke CI.
      # Version and components come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny correctness, warn on the rest)
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness

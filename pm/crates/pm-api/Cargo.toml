[package]
name = "caddy-rs-pm-api"
description = "PM native REST API skeleton with axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
axum = { version = "0.8", features = ["json"] }
caddy-rs-authn = { path = "../../../crates/authn" }
caddy-rs-pm-config = { path = "../pm-config" }
caddy-rs-pm-core = { path = "../pm-core" }
caddy-rs-pm-certificates = { path = "../pm-certificates" }
caddy-rs-pm-hosts = { path = "../pm-hosts" }
caddy-rs-pm-policies = { path = "../pm-policies" }
caddy-rs-pm-runtime = { path = "../pm-runtime" }
caddy-rs-pm-service = { path = "../pm-service" }
caddy-rs-pm-state = { path = "../pm-state" }
caddy-rs-core = { path = "../../../crates/core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# `axum-test` was removed rather than kept: it depends on `expect-json`, which depends on
# `chrono` unconditionally, and `chrono` is unmaintained (RUSTSEC-2026-0543). The replacement
# is `src/test_harness.rs`, which drives the router through `tower::ServiceExt::oneshot` --
# the same mechanism `axum-test` used -- and covers exactly the API surface the suite calls.
# Adding it back reintroduces the advisory.
http-body-util = { workspace = true }
tempfile = { workspace = true }
# `ServiceExt::oneshot`, used by the harness to drive the router in-process.
tower = { version = "0.5", features = ["util"] }
tokio = { workspace = true, features = ["full"] }
[package]
name = "caddy-rs-pm-api"
description = "PM native REST API skeleton with axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
axum = { version = "0.8", features = ["json"] }
caddy-rs-pm-config = { path = "../pm-config" }
caddy-rs-pm-core = { path = "../pm-core" }
caddy-rs-pm-certificates = { path = "../pm-certificates" }
caddy-rs-pm-hosts = { path = "../pm-hosts" }
caddy-rs-pm-policies = { path = "../pm-policies" }
caddy-rs-pm-runtime = { path = "../pm-runtime" }
caddy-rs-pm-service = { path = "../pm-service" }
caddy-rs-pm-state = { path = "../pm-state" }
caddy-rs-core = { path = "../../../crates/core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
axum-test = "22.0.0-rc.1"
caddy-rs-admin = { path = "../../../crates/admin" }
caddy-rs-server = { path = "../../../crates/server" }
caddy-rs-tls = { path = "../../../crates/tls" }
base64 = "0.23.1"
ring = "0.17.14"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
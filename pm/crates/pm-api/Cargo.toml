[package]
name = "caddy-rs-pm-api"
description = "PM native REST API skeleton with axum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
caddy-rs-pm-config = { path = "../pm-config" }
caddy-rs-pm-core = { path = "../pm-core" }
caddy-rs-pm-runtime = { path = "../pm-runtime" }
caddy-rs-core = { path = "../../../crates/core" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
axum-test = "22.0.0-rc.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
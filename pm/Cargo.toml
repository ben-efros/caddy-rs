# This directory is a member of the parent caddy-rs workspace (see ../Cargo.toml), not a
# workspace root of its own.
#
# That is deliberate. As a separate workspace root, pm's upward path dependencies
# (crates/authn, crates/core, crates/config-tx) resolved to paths OUTSIDE the workspace root.
# Cargo hashes package identity with PackageId::stable_hash(ws_root), stripping the
# workspace-root prefix so the hash covers a workspace-relative path; when the prefix does not
# match it falls back to hashing the ABSOLUTE path. That absolute path reached -C metadata and
# therefore rustc's StableCrateId, so caddy-rs-pm differed byte-for-byte depending on where it
# was built (T-REL-020).
#
# With pm as a member, every crate it depends on lives inside the workspace root, strip_prefix
# succeeds, and the hashes are identical on every machine.
#
# The pm crates are listed in the parent's `members` list. The workspace-wide tables
# ([workspace.package], [workspace.dependencies]) live in the parent manifest, because a
# workspace member cannot declare them.

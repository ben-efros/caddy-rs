[package]
name = "caddy-rs-admin"
description = "Caddy-compatible admin API for runtime configuration and lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.1"
flate2 = "1"
zstd = "0.14"
bytes = { workspace = true }
caddy-rs-config = { workspace = true, default-features = false }
caddy-rs-core = { workspace = true, default-features = false }
# Client-certificate metadata for `admin.remote.access_control` identity matching: the configured
# `public_keys` are DER certificates and are parsed with the same helper as the TLS layer.
caddy-rs-tls = { workspace = true, default-features = false }
http = { workspace = true }
ring = "0.17.14"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "caddy-rs-core"
description = "Caddy-compatible configuration model, module registry, validation, and immutable generation lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Build-time module selection. Defaults mirror the full build so nothing changes unless the
# top-level binary is built with `--no-default-features` (or `--features minimal`).
default = ["http3", "compression", "templates"]
# HTTP/3 (`protocols: ["h3"]`, `udp/...` listeners) is served over QUIC.
http3 = []
# Response compression handler (`http.handlers.encode`, gzip/zstd).
compression = []
# Template handler (`http.handlers.templates`).
templates = []

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `admin.remote.access_control[].public_keys` are base64-encoded DER certificates (Caddy
# `admin.go:205`); validation decodes them. Already in the workspace lock file.
base64 = "0.23.1"
tokio = { workspace = true }

[package]
name = "caddy-rs-http"
description = "HTTP matchers, handlers, route tree, and static/file serving."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Defaults are the full handler set. Disabling them removes the `encode`/`templates` handler
# modules (and their dependencies) from the build; a configuration that still references them is
# rejected by validation as an unknown handler (see `caddy-rs-core`'s matching features).
default = ["compression", "templates"]
# `http.handlers.encode` (gzip via flate2, zstd via the zstd crate).
compression = ["dep:flate2", "dep:zstd", "caddy-rs-core/compression"]
# `http.handlers.templates`.
templates = ["caddy-rs-core/templates"]

[dependencies]
argon2 = "0.6"
async-trait = { workspace = true }
base64 = { workspace = true }
bcrypt = "0.16"
bytes = { workspace = true }
# The request-scoped access-log carrier (`AccessLogContext`) is owned by the admin crate, which the
# server also uses to render entries. `caddy-rs-http` only depends on the model, never on the
# runtime/admin API, and the dependency is acyclic (admin -> config/core, not http).
caddy-rs-admin = { workspace = true, default-features = false }
caddy-rs-core = { workspace = true, default-features = false }
# Real path of an open file, to verify a handle stayed inside the served root.
caddy-rs-fsperm = { path = "../fsperm" }
caddy-rs-tls = { workspace = true, default-features = false }
flate2 = { version = "1", optional = true }
http = { workspace = true }
http-body = "1.1.0"
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
ring = "0.17.14"
# T-DEPS-015 phase 2: ACME server JWS signature verification moves onto aws-lc-rs, the same provider
# rustls uses in this workspace. ring stays until phase 3 removes the remaining sites.
aws-lc-rs = "1.19.0"
# Radar client: hyper HTTP/1 over rustls for https://, platform trust store for the API host.
rustls = { version = "0.23.45", default-features = false, features = [
    "std", "aws_lc_rs", "tls12", "logging",
] }
rustls-platform-verifier = "0.7.1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = [
    "aws_lc_rs", "tls12", "logging",
] }
zstd = { version = "0.14", optional = true }
maxminddb = "0.33.0"

# Only for the `O_NOFOLLOW`/`O_NONBLOCK`/`ELOOP` constants used when opening served files
# (no unsafe code; the crate stays `forbid(unsafe_code)`).
[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
caddy-rs-config = { workspace = true }
tempfile = "3.27.0"

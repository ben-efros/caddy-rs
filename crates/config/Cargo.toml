[package]
name = "caddy-rs-config"
description = "Caddyfile lexer, parser, and Caddy-JSON adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
caddy-rs-core = { path = "../core", default-features = false }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# Safe-mode imports check the file's DACL and owner, since Windows has no mode bits or uid.
caddy-rs-fsperm = { path = "../fsperm" }

[dev-dependencies]
caddy-rs-test-support = { path = "../test-support" }

[package]
name = "caddy-rs-tls"
description = "TLS certificate storage, cache, SNI selection, issuer traits, and renewal scheduling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
caddy-rs-core = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# ACME (RFC 8555) account/JWS foundation: ES256 signing, SHA-256, HMAC and base64url.
# Both crates are present in the offline registry cache used by this workspace.
base64 = "0.22.1"
ring = "0.17.14"

# RSA account keys and certificate keys (certmagic supports rsa2048/rsa4096). All transitive
# dependencies are present in the offline registry cache; feature set avoids network/build-script
# dependencies.
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "u64_digit"] }
sha2 = { version = "0.10.9", features = ["oid"] }
rand = "0.8.8"

# ACME order client: production HTTP(S) transport over hyper + rustls (ring provider).
# All of these are already in the offline registry cache; feature sets deliberately avoid
# aws-lc-rs, rustls-native-certs and webpki-roots (not cached in this workspace).
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
httpdate = "1.0.3"
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12", "logging"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "logging", "ring"] }
# Proxy support for ACME `network_proxy`: a tower-service connector that upgrades the proxy
# CONNECT tunnel with rustls before handing it to hyper (T-TLS-070).
tower-service = "0.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
hmac = "0.12.1"
hex = "0.4.3"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"

[dev-dependencies]
tempfile = "3.27.0"

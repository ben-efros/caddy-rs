[package]
name = "caddy-rs-tls"
description = "TLS certificate storage, cache, SNI selection, issuer traits, and renewal scheduling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
caddy-rs-core = { workspace = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# ACME (RFC 8555) account/JWS foundation: ES256 signing, SHA-256, HMAC and base64url.
# Both crates are present in the offline registry cache used by this workspace.
base64 = "0.23.1"
ring = "0.17.14"

# RSA account keys and certificate keys (certmagic supports rsa2048/rsa4096). All transitive
# dependencies are present in the offline registry cache; feature set avoids network/build-script
# dependencies.
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "u64_digit"] }
sha2 = { version = "0.10.9", features = ["oid"] }
rand = "0.8.8"

# PKCS#11 token-held TLS keys (T-TLS-097). Dynamic loading is built in: no features,
# no build-script/network dependency. cryptoki 0.7.0 pulls cryptoki-sys, libloading,
# secrecy 0.8, bitflags 1.x and paste, all present in the offline registry cache.
cryptoki = "0.7.0"
# Same 0.8 instance cryptoki 0.7 uses, so `AuthPin::expose_secret` (PIN equality) resolves.
secrecy = "0.8.0"

# ACME order client: production HTTP(S) transport over hyper + rustls.
# The rustls provider is aws-lc-rs (not ring): it implements the ECDSA P-521 signature scheme
# Caddy accepts for certificates. aws-lc-rs 1.19 / aws-lc-sys 0.47 are in the workspace offline
# cargo cache, so the locked build stays offline.
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
httpdate = "1.0.3"
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12", "logging"] }
# WebPKI path validation of a presented client-certificate chain against one configured
# `admin.remote.access_control` anchor (T-ADMIN-061). Same crate/version rustls already uses;
# the provider feature matches rustls's aws-lc-rs provider so no second crypto backend is added.
rustls-webpki = { version = "0.103.16", default-features = false, features = ["std", "aws-lc-rs"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "logging", "aws-lc-rs"] }
# Proxy support for ACME `network_proxy`: a tower-service connector that upgrades the proxy
# CONNECT tunnel with rustls before handing it to hyper (T-TLS-070).
tower-service = "0.3"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
hmac = "0.12.1"
hex = "0.4.3"
percent-encoding = "2.3.2"
quick-xml = "0.41.0"

[dev-dependencies]
tempfile = "3.27.0"

[package]
name = "caddy-rs-server"
description = "Listener management, runtime supervisor, hyper HTTP serving, and generation-aware reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Defaults are the full server. `--no-default-features` builds a TCP-only server without the
# QUIC stack or the optional HTTP handlers; configuration that still asks for HTTP/3, `encode`
# or `templates` is rejected by validation with a located error.
default = ["http3", "compression", "templates"]
# HTTP/3 over QUIC: `quinn`, `h3`, `h3-quinn`, UDP listener supervision, derived `udp/...`
# listeners and Alt-Svc advertisement.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn", "caddy-rs-core/http3"]
# Forwarded so the HTTP engine's handler set matches the binary's feature selection.
compression = ["caddy-rs-http/compression"]
templates = ["caddy-rs-http/templates"]

[dependencies]
base64 = "0.22.1"
bytes = { workspace = true }
caddy-rs-admin = { workspace = true, default-features = false }
caddy-rs-core = { workspace = true, default-features = false }
caddy-rs-http = { workspace = true, default-features = false }
caddy-rs-proxy = { workspace = true, default-features = false }
caddy-rs-tls = { workspace = true, default-features = false }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = "0.2.189"
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12", "logging"] }
serde_json = { workspace = true }
socket2 = "0.6.5"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
h2 = "0.4.19"
caddy-rs-config = { workspace = true }
base64 = "0.22.1"
ring = "0.17.14"
tempfile = "3.27.0"

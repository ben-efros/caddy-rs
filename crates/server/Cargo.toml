[package]
name = "caddy-rs-server"
description = "Listener management, runtime supervisor, hyper HTTP serving, and generation-aware reload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Defaults are the full server. `--no-default-features` builds a TCP-only server without the
# QUIC stack or the optional HTTP handlers; configuration that still asks for HTTP/3, `encode`
# or `templates` is rejected by validation with a located error.
default = ["http3", "compression", "templates"]
# HTTP/3 over QUIC: `quinn`, `h3`, `h3-quinn`, UDP listener supervision, derived `udp/...`
# listeners and Alt-Svc advertisement.
http3 = ["dep:quinn", "dep:h3", "dep:h3-quinn", "caddy-rs-core/http3"]
# Forwarded so the HTTP engine's handler set matches the binary's feature selection.
compression = ["caddy-rs-http/compression"]
templates = ["caddy-rs-http/templates"]
# Graceful process restart (binary upgrade) via `ecdysis` (ADR-0044). Default-OFF: when this
# feature is disabled, `ecdysis` is not built at all, so the dependency set, the binary and the
# reproducible-build gate are byte-identical to a workspace that never had this feature. See
# docs/adr/0044-process-graceful-restart.md OQ-2 for the decider's dependency decision.
#
# KNOWN COST, accepted and measured (T-CORE-101): `ecdysis` 1.1.1 requires socket2 ^0.5 while this
# workspace pins 0.6.5, so enabling this feature makes the lockfile carry TWO socket2 versions
# (0.5.10 and 0.6.5). The cost is bounded and does not reach a default build:
#   - feature OFF: `cargo tree -p caddy-rs-server` resolves socket2 0.6.5 only; 0.5.10 is not in
#     the graph and is never compiled, so default builds are unaffected.
#   - feature ON: both versions compile; the extra one is socket2 0.5.10 (332 KiB of source).
# A second degree-duplicate arrives the same way: `nix` 0.26 pulls bitflags 1.3.2 while the rest
# of the workspace is on bitflags 2.13.2, so the feature-on lockfile carries both. Same bound:
# neither is in a feature-off graph. Both are transitive through ecdysis and disappear when it
# updates.
# It was NOT eliminated by vendoring-forcing ecdysis onto socket2 0.6 even though that builds
# clean: ecdysis is the process-restart/descriptor-inheritance library this feature depends on, and
# carrying a locally patched fork of it would mean owning its correctness and security updates.
# The existing `vendor/httpdate` patch is a narrow workaround for an unavailable crate, not a
# precedent for forking a security-sensitive dependency. Revisit if upstream ecdysis moves to
# socket2 0.6, at which point the duplicate disappears with no change here.
graceful-restart = ["dep:ecdysis", "dep:socket2-v05"]
# UDP graceful restart via SO_REUSEPORT plus the udpgrm client (ADR-0045). Default-OFF, and
# independent of `graceful-restart`: the TCP path inherits a listener fd and needs no reuseport
# group, while UDP has no listener to inherit and needs the reuseport group plus udpgrm's eBPF
# flow dispatch (ADR-0045 §1). Enabling one does not enable the other.
#
# This feature adds NO dependency: the udpgrm protocol is three `setsockopt`/`getsockopt` calls on
# `SOL_UDP` with option numbers transcribed from udpgrm's out-of-tree header (see `udpgrm.rs`), so
# there is nothing to link against. It does require `http3`, because the only UDP listeners caddy-rs
# creates today are the QUIC ones.
udpgrm = ["http3"]

[dependencies]
# Optional: only compiled with the `graceful-restart` feature. Unix-only - the feature requires
# fork/exec and file-descriptor inheritance, which do not exist on Windows.
ecdysis = { version = "1.1.1", optional = true }
# ecdysis 1.1.1 builds its sockets with socket2 ^0.5 while this workspace pins 0.6.5, so
# `build_listen_tcp` hands the closure a socket2-v0.5 `Socket`. Both versions are already in
# the graph (see the KNOWN COST note above), so this is an alias to the version ecdysis
# actually uses, not a third copy. Without it the closure signature cannot name the type.
socket2-v05 = { package = "socket2", version = "0.5.10", optional = true }
base64 = { workspace = true }
bytes = { workspace = true }
caddy-rs-admin = { workspace = true, default-features = false }
caddy-rs-core = { workspace = true, default-features = false }
caddy-rs-http = { workspace = true, default-features = false }
caddy-rs-proxy = { workspace = true, default-features = false }
caddy-rs-tls = { workspace = true, default-features = false }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = "0.2.189"
# QUIC uses the same rustls provider as TCP TLS: aws-lc-rs (rustls-ring would pull the ring
# provider back in and rustls rejects a second default provider). `bloom`, `log` and
# `runtime-tokio` replace quinn's default feature set minus `rustls-ring`.
quinn = { version = "0.11", optional = true, default-features = false, features = [
    "bloom", "log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs",
] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12", "logging"] }
serde_json = { workspace = true }
socket2 = "0.6.5"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing = { workspace = true }

[dev-dependencies]
caddy-rs-test-support = { path = "../test-support" }
async-trait = { workspace = true }
h2 = "0.4.19"
caddy-rs-config = { workspace = true }
base64 = { workspace = true }
ring = "0.17.14"
tempfile = "3.27.0"
tracing = { workspace = true }

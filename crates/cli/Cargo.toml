[package]
name = "caddy-rs"
description = "The caddy-rs command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "caddy-rs"
path = "src/main.rs"

[features]
# Full build (behaviour-identical default). Disable with `--no-default-features` for a minimal
# binary, optionally together with `--features minimal` to make the intent explicit.
default = ["http3", "compression", "templates"]
# HTTP/3 over QUIC (server listeners, UDP derivation, Alt-Svc).
http3 = ["caddy-rs-server/http3"]
# Response compression handler (`encode`, gzip/zstd).
compression = ["caddy-rs-server/compression"]
# Template handler (`templates`).
templates = ["caddy-rs-server/templates"]
# Convenience marker for a minimal build: `--no-default-features --features minimal`.
minimal = []
# Graceful process restart (binary upgrade, ADR-0044). Default-OFF and Unix-only: on Windows and
# any other non-Unix target the feature fails to compile with a named error instead of silently
# falling back to stop-then-start (ADR-0044 section 5).
graceful-restart = ["caddy-rs-server/graceful-restart"]
# UDP graceful restart via SO_REUSEPORT + udpgrm (ADR-0045). Default-OFF and independent of
# `graceful-restart`: a deployment can keep QUIC flows across a restart without adopting the TCP
# binary-upgrade path. Requires `http3`, because the only UDP listeners caddy-rs creates are the
# QUIC ones.
udpgrm = ["caddy-rs-server/udpgrm"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
caddy-rs-admin = { workspace = true, default-features = false }
caddy-rs-authn = { workspace = true, default-features = false }
caddy-rs-config = { workspace = true, default-features = false }
caddy-rs-core = { workspace = true, default-features = false }
caddy-rs-http = { workspace = true, default-features = false }
caddy-rs-server = { workspace = true, default-features = false }
caddy-rs-tls = { workspace = true, default-features = false }
clap = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = "0.2.189"
rand = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
caddy-rs-test-support = { path = "../test-support" }
# T-SETUP-008: the activation endpoint serves TLS, so the real-socket test has to speak it. Same
# crate/version the TLS crate already pins, so this adds no second crypto backend.
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12", "logging"] }
tempfile = "3.27.0"

[package]
name = "caddy-rs"
description = "The caddy-rs command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "caddy-rs"
path = "src/main.rs"

[features]
# Full build (behaviour-identical default). Disable with `--no-default-features` for a minimal
# binary, optionally together with `--features minimal` to make the intent explicit.
default = ["http3", "compression", "templates"]
# HTTP/3 over QUIC (server listeners, UDP derivation, Alt-Svc).
http3 = ["caddy-rs-server/http3"]
# Response compression handler (`encode`, gzip/zstd).
compression = ["caddy-rs-server/compression"]
# Template handler (`templates`).
templates = ["caddy-rs-server/templates"]
# Convenience marker for a minimal build: `--no-default-features --features minimal`.
minimal = []

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
caddy-rs-admin = { workspace = true, default-features = false }
caddy-rs-config = { workspace = true, default-features = false }
caddy-rs-core = { workspace = true, default-features = false }
caddy-rs-server = { workspace = true, default-features = false }
clap = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
libc = "0.2.189"
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
caddy-rs-test-support = { path = "../test-support" }
tempfile = "3.27.0"

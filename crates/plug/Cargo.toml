[package]
name = "caddy-rs-plug"
description = "Versioned WebAssembly plugin host ABI for caddy-rs: negotiation, capability grants, host calls and HTTP bridging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The in-process WASM host runtime (T-PLUG-011). Off by default: the secure baseline and `minimal`
# profiles compile no guest runtime; enabling it is an explicit opt-in for trusted plugins. The
# pinned Wasmtime 36.0.20 has no open sandbox advisories (the previous 34.0.2 pin did, tracked by
# T-PLUG-030), but the feature still raises the effective MSRV to 1.88 (wat 1.263), so build it
# with rustc >= 1.88.
default = []
wasm-runtime = ["dep:wasmtime"]

[dependencies]
# The ABI types derive Serialize/Deserialize so a future host (T-PLUG-011) can load plugin
# manifests with whichever format it chooses. This crate defines no format of its own and has no
# third-party dependencies. The host lifecycle module additionally reuses the project's
# configuration-generation vocabulary from `caddy-rs-core` (T-CORE-012) so external module
# services are generation-scoped exactly like listeners and other runtime resources.
serde = { workspace = true }
caddy-rs-core = { workspace = true }
async-trait = { workspace = true }
wasmtime = { version = "36", optional = true }

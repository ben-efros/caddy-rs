[package]
name = "caddy-rs-authn"
description = "Authentication and authorization service for caddy-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace
# `Timestamp` (RFC 3339 wire-compatible UTC instant) lives here now that `chrono` is banned.
caddy-rs-core = { path = "../core", default-features = false }
# External dependencies
serde = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
# Crypto and JWT
argon2 = { version = "0.6", features = ["password-hash"] }
bcrypt = "0.16"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
rand = { workspace = true }
base32 = "0.5"
totp-lite = "2.0"
uuid = { version = "1.11", features = ["v4", "serde", "fast-rng"] }
urlencoding = "2.1"
sha2 = { workspace = true }
subtle = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

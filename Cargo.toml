[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/config",
    "crates/http",
    "crates/l4",
    "crates/proxy",
    "crates/tls",
    "crates/admin",
    "crates/auth",
    "crates/server",
    "crates/cli",
    "crates/plug",
    "crates/authn",
    "crates/config-tx",
    "crates/test-support",
    # Vendored ecdysis 1.1.1 (T-OPS-106 API-compat shim). A workspace member so its
    # golden-bytes wire test runs under `cargo test --workspace` and the audit gate's
    # `cargo audit --file Cargo.lock` sees it in the same lockfile.
    "vendor/ecdysis",
    # Proxy-manager crates (T-REL-020). Listed here rather than in pm/Cargo.toml because a
    # workspace member cannot declare its own members or workspace tables.
    "pm/crates/pm-state",
    "pm/crates/pm-core",
    "pm/crates/pm-compiler",
    "pm/crates/pm-config",
    "pm/crates/pm-hosts",
    "pm/crates/pm-service",
    "pm/crates/pm-policies",
    "pm/crates/pm-certificates",
    "pm/crates/pm-import",
    "pm/crates/pm-runtime",
    "pm/crates/pm-api",
    "pm/crates/pm-cli",
]

[workspace.package]
version = "0.1.0-trial.7"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/example/caddy-rs"
authors = ["caddy-rs contributors"]

[workspace.dependencies]
# Declared here because pm crates inherit them via `workspace = true` and a workspace
# member cannot declare its own [workspace.dependencies] (T-REL-020).
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
ring = "0.17.14"
sd-notify = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
# Internal crates (path dependencies declared once). Default features are declared off here so a
# dependent crate can opt in explicitly (required for `caddy-rs`'s `--no-default-features` to
# really disable the optional modules; without this, Cargo ignores member-level
# `default-features = false`).
caddy-rs-core = { path = "crates/core", default-features = false }
caddy-rs-config = { path = "crates/config", default-features = false }
caddy-rs-config-tx = { path = "crates/config-tx", default-features = false }
caddy-rs-http = { path = "crates/http", default-features = false }
caddy-rs-l4 = { path = "crates/l4", default-features = false }
caddy-rs-proxy = { path = "crates/proxy", default-features = false }
caddy-rs-tls = { path = "crates/tls", default-features = false }
caddy-rs-admin = { path = "crates/admin", default-features = false }
caddy-rs-server = { path = "crates/server", default-features = false }
caddy-rs-plug = { path = "crates/plug", default-features = false }
caddy-rs-auth = { path = "crates/auth", default-features = false }
caddy-rs-authn = { path = "crates/authn", default-features = false }
anyhow = "1.0.104"
arc-swap = "1.7.1"
async-trait = "0.1.92"
bytes = "1.12.1"
# "env" is required by pm-cli's #[arg(env = ...)] attributes. It was declared by pm's own
# workspace before pm became a member; a member cannot add features to a dependency inherited
# via `workspace = true`, so the union of both feature sets has to live here (T-REL-020).
clap = { version = "4.6.7", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "suggestions", "env",
] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", features = [
    "tokio", "server", "client", "client-legacy", "http1", "http2", "server-auto",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.12.3"
tar = "0.4.44"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "process",
] }
tracing = "0.1.44"
tempfile = "3.17"
# Crypto and JWT (for authn crate)
argon2 = { version = "0.6", features = ["password-hash"] }
sha2 = "0.10.9"
# OS-sourced randomness for the ring::rand sites migrated by T-DEPS-014 phase 1. Pinned to the
# version already in Cargo.lock (0.2.17, pulled in via rand's getrandom feature), so this adds no
# new code to the graph.
getrandom = "0.2.17"
subtle = "2.6.1"
bcrypt = "0.16"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
rand = { version = "0.8", features = ["std", "getrandom"] }
base64 = "0.23.1"
base32 = "0.5"
totp-lite = "2.0"
uuid = { version = "1.11", features = ["v4", "serde", "fast-rng"] }
zeroize = "1.8"
secrecy = "0.10"
urlencoding = "2.1"

[patch.crates-io]
# The sandbox that authored this repository has a read-only crates.io cache and cannot download
# `httpdate` (a hyper dependency). The vendored crate implements exactly the surface hyper uses.
# Delete this patch when building online; the vendored crate is version-compatible with 1.0.3.
httpdate = { path = "vendor/httpdate" }
# T-OPS-017: ecdysis 1.1.1 declares `nix = "0.26"` with default features ON. nix's default
# `aio` feature is the ONLY thing that pulls the unmaintained `pin-utils` 0.1.1
# (RUSTSEC-2026-0441) into Cargo.lock. ecdysis never uses nix::aio; it needs only fcntl,
# signal, process and net. This vendored copy changes ONE manifest line-group (nix default
# features off + the four modules ecdysis uses); src/ is byte-identical to crates.io 1.1.1.
# Delete this patch when upstream ecdysis drops its nix default features.
ecdysis = { path = "vendor/ecdysis" }

[profile.release]
lto = "thin"
codegen-units = 1

# Smallest distributable binary: full LTO, size-optimised codegen, stripped symbols and no
# unwinding tables. Used for the static (musl) release artefacts; slower to compile, several
# times smaller on disk.
[profile.release-minimal]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

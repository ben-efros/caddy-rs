[package]
edition = "2021"
name = "ecdysis"
version = "1.1.1"
authors = ["Argo Smart Routing & Orpheus Team at Cloudflare, Inc."]
build = false
exclude = ["integration_tests"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library for graceful restarts in Rust."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/cloudflare/ecdysis"

[package.metadata.release]
pre-release-commit-message = "Release {{version}}"
pre-release-hook = [
    "git-cliff",
    "-o",
    "RELEASE_NOTES",
    "--tag",
    "{{version}}",
]

[features]
default = ["tokio_ecdysis"]
systemd = [
    "systemd_notify",
    "systemd_sockets",
]
systemd_notify = ["tokio_ecdysis"]
systemd_sockets = ["tokio_ecdysis"]
tokio_ecdysis = [
    "dep:futures",
    "dep:tokio",
    "dep:tokio-stream",
]

[lib]
name = "ecdysis"
path = "src/lib.rs"

[[test]]
name = "golden_wire"
path = "tests/golden_wire.rs"

[dependencies.bytes]
version = "1.6.0"

[dependencies.derive_more]
version = "1.0.0"
features = [
    "display",
    "from",
]

[dependencies.futures]
version = "0.3"
features = ["alloc"]
optional = true

[dependencies.log]
version = "0.4"

[dependencies.nix]
version = "=0.32.0"
default-features = false
features = [
    "fs",
    "signal",
    "process",
    "net",
]

[dependencies.os_pipe]
version = "1.1.5"

[dependencies.parking_lot]
version = "0.12"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde-wincode]
version = "=0.1.2"

[dependencies.wincode]
version = "=0.6.3"

[dependencies.socket2]
version = "0.5"

[dependencies.tempfile]
version = "3.10.1"

[dependencies.tokio]
version = "1.37.0"
features = [
    "fs",
    "macros",
    "net",
    "signal",
]
optional = true

[dependencies.tokio-stream]
version = "0.1"
features = [
    "net",
    "signal",
    "sync",
]
optional = true

[dependencies.tokio-util]
version = "0.7"
features = [
    "codec",
    "net",
]


# cargo-audit policy for caddy-rs.
#
# Every ignore below is an explicit, reviewable decision with a reason and a tracking task; the
# default posture is to upgrade rather than ignore. Run `cargo audit` after changing this file.
#
# The workflow runs cargo-audit 0.22.2 with `--deny warnings`, so informational advisories
# (unmaintained, unsound, yanked) gate exactly like vulnerabilities. That is deliberate: without
# `--deny warnings` cargo-audit exits 0 on warnings, so a dependency that becomes unmaintained is
# only printed to the log and can never block a merge. Gating turns every new warning into a
# decision -- upgrade, or accept it here with a reason. Advisory-database churn is not a reason to
# leave warnings advisory: if the database adds a warning, the job fails and the decision is made
# in review rather than silently inherited.

[advisories]
# Verified against the vendored database at .cargo/advisory-db/SNAPSHOT commit 074ea9a7
# (2026-11-19) by removing every ignore and running the gate: exactly ONE advisory is live on the
# current lockfiles -- RUSTSEC-2023-0071 (rsa). The 24 legacy entries from the Wasmtime 34.0.2 pin
# (T-PLUG-030) and earlier were confirmed dead against that database and have been pruned (T-CI-002);
# re-adding an ignore requires the same evidence. Re-derive with:
#   cargo audit --file Cargo.lock --deny warnings --db .cargo/advisory-db --no-fetch
ignore = [
  # --- rsa: no fixed version exists (RUSTSEC-2023-0071, "Marvin" timing side channel).
  # Our RSA use is PKCS#1 v1.5 *signing* and verification only (ACME account keys, JWS RS256,
  # CSR generation). The advisory concerns RSA *decryption* padding oracles, and no code path
  # here performs RSA decryption with an attacker-influenced ciphertext.
  "RUSTSEC-2023-0071",

  # --- chrono: unmaintained (RUSTSEC-2026-0543, 2026-09-14). Not our dependency and not in the
  # shipped binary. The only path to it is
  #   pm/crates/pm-api [dev-dependencies] axum-test -> expect-json -> chrono
  # so it is absent from every release artefact: `cargo tree -e normal` does not reach it, and the
  # advisory is "unmaintained", not a vulnerability. We cannot pin it away either -- the version is
  # chosen by axum-test, and axum-test is our only harness for exercising the pm HTTP surface.
  # Re-check when axum-test stops depending on expect-json, or when expect-json drops chrono
  # (tracked as T-CI-002). Deliberately narrow: this ignores one advisory, not a crate name.
  "RUSTSEC-2026-0543",
]

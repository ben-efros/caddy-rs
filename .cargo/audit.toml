# cargo-audit policy for caddy-rs.
#
# Every ignore below is an explicit, reviewable decision with a reason and a tracking task; the
# default posture is to upgrade rather than ignore. Run `cargo audit` after changing this file.
#
# The workflow runs cargo-audit 0.22.2 with `--deny warnings`, so informational advisories
# (unmaintained, unsound, yanked) gate exactly like vulnerabilities. That is deliberate: without
# `--deny warnings` cargo-audit exits 0 on warnings, so a dependency that becomes unmaintained is
# only printed to the log and can never block a merge. Gating turns every new warning into a
# decision -- upgrade, or accept it here with a reason. Advisory-database churn is not a reason to
# leave warnings advisory: if the database adds a warning, the job fails and the decision is made
# in review rather than silently inherited.

[advisories]
ignore = [
  # --- rsa: no fixed version exists (RUSTSEC-2023-0071, "Marvin" timing side channel).
  # Our RSA use is PKCS#1 v1.5 *signing* and verification only (ACME account keys, JWS RS256,
  # CSR generation). The advisory concerns RSA *decryption* padding oracles, and no code path
  # here performs RSA decryption with an attacker-influenced ciphertext.
  "RUSTSEC-2023-0071",

  # --- wasmtime: the in-process WASM host. The `wasm-runtime` feature is OFF by default
  # (see crates/plug/Cargo.toml), so a default or `minimal` build contains no guest runtime.
  # The pin is now Wasmtime 50.0.2 (13 wasmtime + 2 pulley crates at 50.0.2, cranelift 0.137.2).
  # 50.0.2 is the first 50.x patch outside the RUSTSEC-2026-0566..0573 range, so those eight are
  # deliberately NOT ignored here: they are fixed by the upgrade and must gate if they reappear.
  # The entries below are the residue of the older 34.0.2 pin (T-PLUG-030). They are kept rather
  # than pruned because cargo-audit is unavailable in this environment, so none of them has been
  # confirmed dead against a current advisory database; pruning an ignore still in use would turn
  # the `security` job red. Re-derive this list from a real `cargo audit` run when it is available.
  "RUSTSEC-2025-0118",
  # --- fxhash 0.2.1 (RUSTSEC-2025-0057, unmaintained): reached through
  # fxprof-processed-profile. As of the Wasmtime 50.0.2 pin the crate is no longer in Cargo.lock,
  # so this entry is believed dead but is left in place for the reason given above.
  "RUSTSEC-2025-0057",
  "RUSTSEC-2026-0006",
  "RUSTSEC-2026-0020",
  "RUSTSEC-2026-0021",
  "RUSTSEC-2026-0085",
  "RUSTSEC-2026-0086",
  "RUSTSEC-2026-0087",
  "RUSTSEC-2026-0088",
  "RUSTSEC-2026-0089",
  "RUSTSEC-2026-0091",
  "RUSTSEC-2026-0092",
  "RUSTSEC-2026-0093",
  "RUSTSEC-2026-0094",
  "RUSTSEC-2026-0095",
  "RUSTSEC-2026-0096",
  "RUSTSEC-2026-0114",
  "RUSTSEC-2026-0222",
  "RUSTSEC-2026-0269",
  "RUSTSEC-2026-0316",
  "RUSTSEC-2026-0363",
  "RUSTSEC-2026-0379",
  "RUSTSEC-2026-0380",
  "RUSTSEC-2026-0424",
]
